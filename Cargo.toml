[package]
name = "rodeo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 前端（同时编译 SSR 与 WASM）
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 客户端（hydrate 特性启用）
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# 服务端（ssr 特性启用）
# http2 显式开启：ALPN 协商出 h2 之后必须真的有人会讲 h2。axum-server 会经由 hyper
# 把该特性统一打开，但那是隐式的传递结果，显式声明才与「宣传了 h2」这个承诺相称。
axum = { version = "0.8", features = ["http2"], optional = true }
# HTTPS 由应用自己终结。不启用它的 tls-rustls 特性——那会拉进 rustls/aws-lc-rs，
# 与仓库里既有的 ring provider 并存；而 axum-server 内部用 ServerConfig::builder()，
# 双 provider 会直接 panic。no-provider 让它沿用已有的 ring。
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
# 把 crypto provider 钉死成 ring：rustls 只有在恰好启用一个 provider 时
# ServerConfig::builder() 才不 panic，不能让这件事取决于 reqwest 的特性选择。
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"], optional = true }
rocksdb = { version = "0.22", optional = true }
# 文档存储的 PostgreSQL 后端。同步 API：服务层全是同步方法，而当前运行时是
# current_thread（rocksdb 也已经在上面阻塞调用），换异步 sqlx 等于把 ~15k 行
# 同步 CRUD 全改写成 async，收益配不上这个代价。同步 postgres 客户端每次调用
# 都在它自己的 tokio Runtime 上 block_on，所以连接由 pg.rs 的专用 OS 线程独占
# （见 src/storage/pg.rs 的线程模型注释），没有连接池。
postgres = { version = "0.19", optional = true }
# 附件后端（本地文件系统 / RustFS）。`aws` 特性给的是 S3 协议客户端。
# 版本必须停在 0.12：0.14 会经它引入 aws-lc-rs 和第二个 reqwest，
# 于是 rustls 有了两个 crypto provider，而 axum-server 内部的
# ServerConfig::builder() 在双 provider 下会 panic（详见上面 rustls 的注释）。
# default-features = false 后显式列出 fs：对象存储自己的本地后端在 fs 特性里。
object_store = { version = "0.12", default-features = false, features = ["fs", "aws"], optional = true }
async-graphql = { version = "7", optional = true, features = ["chrono"] }
async-graphql-axum = { version = "7", optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
jsonwebtoken = { version = "9", optional = true }
ulid = { version = "1", features = ["serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
bincode = { version = "1", optional = true }
thiserror = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# 服务端文件日志 + 每日滚动。仅 ssr。直接走同步 IO（不开 non_blocking 缓冲），
# 换取 panic 时日志仍能落盘。
tracing-appender = { version = "0.2", optional = true }
http = { version = "1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs", "limit", "compression-gzip"], optional = true }
tantivy = { version = "0.26", optional = true, default-features = false, features = ["mmap", "lz4-compression"] }
# 全文检索可选后端。仅启用 meilisearch 时才编译进二进制。
# 不写版本兼容区间的「软」声明——锁住，避免 meilisearch-sdk 的次版本破坏 API。
# default-features = false：默认会启 jwt_aws_lc_rs，把 aws-lc-rs 拉进二进制；
# 那会让 rustls 同时有 ring（仓库钉死）与 aws-lc-rs 两个 crypto provider，
# 而 axum-server 的 ServerConfig::builder() 在双 provider 下直接 panic。
# 只开 reqwest + tls（tls 隐含 reqwest/rustls-tls），跳过 jwt_* 特性。
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest", "tls"], optional = true }
# 服务端调用大模型（仅 ssr）。default-features = false 是为了不引入 openssl，
# 与仓库其余依赖一样走 rustls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# OAuth Provider trait 里 `async fn` 需要 `#[async_trait]` 才能走 dyn dispatch；
# 没用 trait_async 原生语法，因为我们要存的是 `Arc<dyn OAuthProvider>`。
async-trait = { version = "0.1", optional = true }
# WeChat 拼 `redirect_uri` 等参数时二次 URL-encode —— 微信文档里明文要求。
urlencoding = { version = "2", optional = true }
# 服务端 SSE 流式生成器（仅 ssr）。axum::response::sse 需要 Stream<Item = Result<Event, _>>，
# 手写状态机不如 async-stream! 宏清晰。
async-stream = { version = "0.3", optional = true }
# `Stream` trait + `StreamExt::next`。async-stream 与 reqwest 的 bytes_stream() 都
# 实现前者但都不直接 re-export；后者要写 `stream.next().await` 就必须在作用域内。
# 已经是间接依赖（async-stream / axum-core / async-graphql 都依赖它），体积零增量。
# default-features = false：关掉它的 allocator / io 特性，只留 stream 适配器，
# 避免把 tokio 的 io-util / sync 再次拉进来。
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
# Agent turn 注册表使用的同步互斥（避免 async 锁在同步临界区的可取消性问题）。
parking_lot = { version = "0.12", optional = true }
# Agent runner 用 `CancellationToken` 让 SSE 断连时干净地中止 turn。
tokio-util = { version = "0.7", features = ["rt"], optional = true }
# LLM agent 重写（rig-agent-rewrite plan）。先锁版本、仅 ssr、可选；
# 后续任务会真正接入 rig_core::message / rig::providers::openai / rig::tool::Tool。
# default-features = false：保留最小特性集（关掉 rig-core 自带的 reqwest/derive/rustls），
# 再开 `rustls` 走 reqwest 0.13 的 rustls 路径；ring 仍由项目顶层 rustls/features=["ring"] 钉死为
# 唯一 provider（axum-server 的 ServerConfig::builder() 在双 provider 下会 panic）。
# `=X.Y.Z` 严格锁版本：rig 还没到 1.0，bincode 编码不稳定。
rig-core = { version = "=0.42.0", default-features = false, features = ["rustls"], optional = true }
rig = { version = "=0.42.0", default-features = false, features = ["agent"], optional = true }

# 仅 WASM 目标
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window", "Document", "HtmlDocument", "DomStringMap", "FormData", "File", "Blob", "Element", "HtmlElement", "CssStyleDeclaration", "DomRect", "TextDecoder", "ReadableStream", "ReadableStreamDefaultReader"] }
# `leptos → rand → getrandom 0.3.4` 在 wasm32-unknown-unknown 上要求 `wasm_js`
# configuration flag；直挂一份 wasm-only 触发 cargo 的 feature unification，
# 见 https://docs.rs/getrandom/0.3.4/#webassembly-support 。
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:urlencoding",
    "dep:ulid",
    "dep:futures-util",
]
ssr = [
    "dep:axum",
    "dep:axum-server",
    "dep:rustls",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:rocksdb",
    "dep:postgres",
    "dep:object_store",
    "dep:async-graphql",
    "dep:async-graphql-axum",
    "dep:argon2",
    "dep:rand_core",
    "dep:jsonwebtoken",
    "dep:ulid",
    "dep:chrono",
    "dep:bincode",
    "dep:thiserror",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:http",
    "dep:tower",
    "dep:tower-http",
    "dep:tantivy",
    "dep:meilisearch-sdk",
    "dep:reqwest",
    "dep:async-trait",
    "dep:urlencoding",
    "dep:async-stream",
    "dep:futures-util",
    "dep:parking_lot",
    "dep:tokio-util",
    "dep:rig-core",
    "dep:rig",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "rodeo"
# 内容哈希：避免 watch 重建后浏览器拿旧 glue 配新 wasm，wasm 实例化失败、页面卡死在 SSR 占位。
hash-files = true
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
env = "DEV"
bin-features = ["ssr"]
bin-default-features = true
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
